<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Cyberpunk Snake Game</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap');

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Press Start 2P', cursive, sans-serif;
    }

    body {
      min-height: 100vh;
      background: #020809;
      color: #e6f1ff;
      overflow: hidden;
    }

    .app-shell {
      display: grid;
      grid-template-columns: minmax(420px, 1.2fr) minmax(320px, 0.8fr);
      gap: 28px;
      width: min(100%, 1280px);
      margin: 32px auto;
      padding: 0 16px 32px;
    }

    .playfield-panel,
    .side-panel {
      background: rgba(4, 12, 22, 0.96);
      border: 1px solid rgba(120, 255, 172, 0.1);
      border-radius: 28px;
      box-shadow: 0 24px 80px rgba(0, 0, 0, 0.28);
      padding: 28px;
    }

    .panel-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 14px;
      margin-bottom: 20px;
    }

    .panel-label,
    .card-label,
    .controls-label {
      color: #80ffb3;
      opacity: 0.9;
      letter-spacing: 0.24em;
      font-size: 0.72rem;
    }

    .panel-level {
      color: #8bffe3;
      opacity: 0.85;
      font-size: 0.78rem;
    }

    .board-wrapper {
      width: 100%;
      aspect-ratio: 1 / 1;
      border-radius: 24px;
      overflow: hidden;
      background: linear-gradient(180deg, rgba(2, 8, 20, 0.95), rgba(18, 34, 60, 0.95));
      border: 1px solid rgba(255, 255, 255, 0.06);
      box-shadow: inset 0 0 30px rgba(255, 255, 255, 0.02);
    }

    .board-wrapper::before {
      content: '';
      position: absolute;
      inset: 0;
      pointer-events: none;
      background-image: linear-gradient(rgba(255, 255, 255, 0.04) 1px, transparent 1px), linear-gradient(90deg, rgba(255, 255, 255, 0.04) 1px, transparent 1px);
      background-size: 32px 32px;
    }

    canvas {
      width: 100%;
      height: 100%;
      display: block;
      position: relative;
      z-index: 1;
    }

    .tray-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-top: 22px;
      gap: 14px;
    }

    .legend-row {
      display: flex;
      gap: 18px;
      flex-wrap: wrap;
    }

    .legend-item {
      display: flex;
      align-items: center;
      gap: 8px;
      color: #a7b4c8;
      font-size: 0.82rem;
    }

    .legend-dot {
      width: 12px;
      height: 12px;
      border-radius: 4px;
      display: inline-block;
    }

    .legend-dot.snake {
      background: #b8ff6f;
      box-shadow: 0 0 12px rgba(184, 255, 111, 0.35);
    }

    .legend-dot.food {
      background: #ff5a70;
      box-shadow: 0 0 12px rgba(255, 90, 112, 0.35);
    }

    .ready-status {
      text-align: right;
    }

    .ready-text {
      display: block;
      color: #8bffda;
      font-size: 0.85rem;
      letter-spacing: 0.18em;
    }

    .ready-subtext {
      display: block;
      color: #8d9abe;
      font-size: 0.72rem;
      margin-top: 6px;
    }

    .side-panel {
      display: grid;
      gap: 22px;
    }

    .score-card {
      background: #d5ff56;
      border-radius: 24px;
      padding: 24px;
      color: #091202;
      box-shadow: inset 0 0 40px rgba(150, 255, 100, 0.15);
    }

    .score-display {
      margin: 16px 0 12px;
      font-size: clamp(3rem, 6vw, 5.2rem);
      font-weight: 800;
      letter-spacing: 0.18em;
      line-height: 0.9;
    }

    .score-footer {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 16px;
      color: #1f2a17;
      opacity: 0.9;
      font-size: 0.82rem;
    }

    .score-delta {
      background: rgba(1, 8, 12, 0.7);
      padding: 10px 14px;
      border-radius: 14px;
    }

    .stats-card,
    .controls-card {
      background: rgba(3, 18, 32, 0.9);
      border: 1px solid rgba(103, 255, 188, 0.12);
      border-radius: 26px;
      padding: 20px;
    }

    .info-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 14px;
      color: #c6d2e5;
      font-size: 0.94rem;
    }

    .info-row:last-child {
      margin-bottom: 0;
    }

    .info-row span:last-child {
      color: #f8fbff;
      font-variant-numeric: tabular-nums;
    }

    .controls-card {
      text-align: center;
    }

    .controls-grid {
      display: grid;
      grid-template-columns: 1fr;
      justify-items: center;
      gap: 14px;
      margin: 18px 0;
    }

    .control-row {
      display: grid;
      grid-template-columns: repeat(3, minmax(54px, 1fr));
      gap: 12px;
    }

    .control-key {
      width: 56px;
      height: 56px;
      display: grid;
      place-items: center;
      border: 1px solid rgba(120, 255, 172, 0.16);
      border-radius: 14px;
      background: rgba(6, 18, 36, 0.88);
      color: #b8ffdf;
      font-size: 1.1rem;
      box-shadow: inset 0 0 12px rgba(0, 0, 0, 0.2);
    }

    .controls-hint {
      color: #82b6c8;
      font-size: 0.7rem;
      line-height: 1.6;
      letter-spacing: 0.12em;
    }

    .restart-btn,
    .small-button {
      width: 100%;
      border: none;
      border-radius: 18px;
      padding: 18px 16px;
      font-size: 0.95rem;
      font-weight: 700;
      cursor: pointer;
      transition: transform 0.2s ease, filter 0.2s ease;
    }

    .restart-btn {
      background: #9eff65;
      color: #041200;
      box-shadow: 0 18px 46px rgba(159, 255, 101, 0.2);
    }

    .small-button {
      background: rgba(136, 255, 205, 0.15);
      color: #b8ffe7;
      border: 1px solid rgba(136, 255, 205, 0.22);
    }

    .restart-btn:hover,
    .small-button:hover {
      transform: translateY(-2px);
      filter: brightness(1.05);
    }

    .overlay {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(1, 7, 18, 0.9);
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      gap: 18px;
      padding: 24px;
      border-radius: 24px;
    }

    .overlay h2 {
      color: #ff92b2;
      font-size: clamp(1.6rem, 3vw, 2.4rem);
    }

    .overlay p {
      color: #b8c9dd;
      text-align: center;
      font-size: 0.95rem;
    }

    .overlay.hidden {
      display: none;
    }

    @media (max-width: 1120px) {
      .app-shell {
        grid-template-columns: 1fr;
      }
    }

    @media (max-width: 640px) {
      .app-shell {
        gap: 18px;
        margin: 18px auto;
      }

      .playfield-panel,
      .side-panel {
        padding: 20px;
        border-radius: 22px;
      }

      .panel-top,
      .tray-row,
      .score-footer {
        flex-direction: column;
        align-items: flex-start;
      }

      .score-display {
        font-size: 3.2rem;
      }

      .control-row {
        grid-template-columns: repeat(3, 1fr);
      }
    }
  </style>
</head>
<body>
  <div class="app-shell">
    <section class="playfield-panel">
      <div class="panel-top">
        <span class="panel-label">PLAYFIELD</span>
        <span class="panel-level">LEVEL <span id="level">01</span></span>
      </div>

      <div class="board-wrapper">
        <canvas id="gameCanvas" width="400" height="400"></canvas>
        <div id="game-over-screen" class="overlay hidden">
          <h2>GAME OVER</h2>
          <p>Final Score: <span id="final-score">0</span></p>
          <button id="gameover-restart-btn">PLAY AGAIN</button>
        </div>
      </div>

      <div class="tray-row">
        <div class="legend-row">
          <span class="legend-item"><span class="legend-dot snake"></span> SNAKE</span>
          <span class="legend-item"><span class="legend-dot food"></span> FOOD</span>
        </div>
        <div class="ready-status">
          <span class="ready-text">READY</span>
          <span class="ready-subtext">USE THE CONTROLS TO PLAY</span>
        </div>
      </div>
    </section>

    <aside class="side-panel">
      <div class="score-card">
        <span class="card-label">CURRENT SCORE</span>
        <div class="score-display" id="score">0000</div>
        <div class="score-footer">
          <span class="best-score">BEST <span id="high-score">0000</span></span>
          <span class="score-delta" id="score-delta">+0%</span>
        </div>
      </div>

      <div class="stats-card">
        <div class="info-row">
          <span>HIGH SCORE</span>
          <span id="high-score-panel">0000</span>
        </div>
        <div class="info-row">
          <span>SPEED</span>
          <span><span id="speed">22.2</span> px/s</span>
        </div>
        <div class="info-row">
          <span>SEGMENTS</span>
          <span id="segments">01</span>
        </div>
      </div>

      <div class="controls-card">
        <div class="controls-label">CONTROLS</div>
        <div class="controls-grid">
          <div class="control-key">↑</div>
          <div class="control-row">
            <div class="control-key">←</div>
            <div class="control-key">↓</div>
            <div class="control-key">→</div>
          </div>
        </div>
        <div class="controls-hint">ARROW KEYS TO MOVE<br />SPACE TO PAUSE</div>
      </div>

      <button id="restart-btn" class="restart-btn">RESTART GAME</button>
      <button id="fullscreen-btn" class="small-button">FULL SCREEN</button>
    </aside>
  </div>

  <script>
    const canvas = document.getElementById("gameCanvas");
    const ctx = canvas.getContext("2d");

    const scoreEl = document.getElementById("score");
    const highScoreEl = document.getElementById("high-score");
    const highScorePanelEl = document.getElementById("high-score-panel");
    const scoreDeltaEl = document.getElementById("score-delta");
    const speedEl = document.getElementById("speed");
    const segmentsEl = document.getElementById("segments");
    const levelEl = document.getElementById("level");
    const gameOverScreen = document.getElementById("game-over-screen");
    const finalScoreEl = document.getElementById("final-score");
    const restartBtn = document.getElementById("restart-btn");
    const gameOverRestartBtn = document.getElementById("gameover-restart-btn");
    const fullscreenBtn = document.getElementById("fullscreen-btn");

    const gridSize = 20;
    let snake = [{ x: 10, y: 10 }];
    let food = { x: 15, y: 15 };
    let level = 1;
    let dx = 1;
    let dy = 0;
    let score = 0;
    let highScore = Number(localStorage.getItem("snakeHighScore")) || 0;
    let gameInterval;
    const gameSpeed = 90;

    highScoreEl.innerText = highScore;

    document.addEventListener("keydown", handleKeydown);
    restartBtn.addEventListener("click", resetGame);
    gameOverRestartBtn.addEventListener("click", resetGame);
    fullscreenBtn.addEventListener("click", toggleFullScreen);
    window.addEventListener("resize", onWindowResize);
    document.addEventListener("fullscreenchange", onFullScreenChange);

    function getTileCount() {
      return canvas.width / gridSize;
    }

    function resizeCanvas() {
      const margin = 80;
      const maxSize = Math.min(window.innerWidth - margin, window.innerHeight - margin - 120);
      const size = Math.max(gridSize * 12, Math.floor(maxSize / gridSize) * gridSize);
      canvas.width = size;
      canvas.height = size;
    }

    function startGame() {
      resizeCanvas();
      if (gameInterval) {
        clearInterval(gameInterval);
      }
      updateHud();
      gameInterval = setInterval(gameLoop, gameSpeed);
      fullscreenBtn.innerText = document.fullscreenElement ? "EXIT FULL SCREEN" : "ENTER FULL SCREEN";
    }

    function gameLoop() {
      updateSnake();
      if (checkGameOver()) {
        handleGameOver();
        return;
      }
      clearCanvas();
      drawFood();
      drawSnake();
    }

    function clearCanvas() {
      const gradient = ctx.createLinearGradient(0, 0, canvas.width, canvas.height);
      gradient.addColorStop(0, "#090a10");
      gradient.addColorStop(1, "#0b1120");
      ctx.fillStyle = gradient;
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      ctx.strokeStyle = "rgba(255, 255, 255, 0.04)";
      for (let i = 0; i <= canvas.width; i += gridSize) {
        ctx.beginPath();
        ctx.moveTo(i, 0);
        ctx.lineTo(i, canvas.height);
        ctx.stroke();
        ctx.beginPath();
        ctx.moveTo(0, i);
        ctx.lineTo(canvas.width, i);
        ctx.stroke();
      }
    }

    function drawSnake() {
      snake.forEach((segment, index) => {
        if (index === 0) {
          ctx.fillStyle = "#72ffe7";
          ctx.shadowBlur = 18;
          ctx.shadowColor = "rgba(114, 255, 231, 0.8)";
        } else {
          ctx.fillStyle = "#2ad3b5";
          ctx.shadowBlur = 8;
          ctx.shadowColor = "rgba(42, 211, 181, 0.35)";
        }
        ctx.fillRect(
          segment.x * gridSize + 2,
          segment.y * gridSize + 2,
          gridSize - 4,
          gridSize - 4
        );
      });
      ctx.shadowBlur = 0;
    }

    function updateSnake() {
      const head = { x: snake[0].x + dx, y: snake[0].y + dy };
      snake.unshift(head);

      if (head.x === food.x && head.y === food.y) {
        score += 10;
        scoreEl.innerText = score;
        generateFood();
      } else {
        snake.pop();
      }
    }

    function generateFood() {
      const tileCount = getTileCount();
      let nextFood;
      do {
        nextFood = {
          x: Math.floor(Math.random() * tileCount),
          y: Math.floor(Math.random() * tileCount),
        };
      } while (snake.some(segment => segment.x === nextFood.x && segment.y === nextFood.y));

      food = nextFood;
    }

    function drawFood() {
      ctx.fillStyle = "#ff4fb8";
      ctx.shadowBlur = 16;
      ctx.shadowColor = "rgba(255, 79, 184, 0.8)";
      ctx.beginPath();
      ctx.arc(
        food.x * gridSize + gridSize / 2,
        food.y * gridSize + gridSize / 2,
        gridSize / 2 - 3,
        0,
        Math.PI * 2
      );
      ctx.fill();
      ctx.shadowBlur = 0;
    }

    function updateHud() {
      scoreEl.innerText = score.toString().padStart(4, "0");
      highScoreEl.innerText = highScore.toString().padStart(4, "0");
      highScorePanelEl.innerText = highScore.toString().padStart(4, "0");
      scoreDeltaEl.innerText = getScoreDelta();
      speedEl.innerText = (1000 / gameSpeed).toFixed(1);
      segmentsEl.innerText = snake.length.toString().padStart(2, "0");
      levelEl.innerText = level.toString().padStart(2, "0");
    }

    function getScoreDelta() {
      if (highScore === 0) return "+0%";
      return `+${Math.round((score / highScore) * 100)}%`;
    }

    function handleKeydown(e) {
      if (e.key === " ") {
        e.preventDefault();
        togglePause();
        return;
      }
      changeDirection(e);
    }

    function changeDirection(e) {
      const key = e.key.toLowerCase();
      if ((key === "arrowup" || key === "w") && dy === 0) { dx = 0; dy = -1; }
      if ((key === "arrowdown" || key === "s") && dy === 0) { dx = 0; dy = 1; }
      if ((key === "arrowleft" || key === "a") && dx === 0) { dx = -1; dy = 0; }
      if ((key === "arrowright" || key === "d") && dx === 0) { dx = 1; dy = 0; }
    }

    function checkGameOver() {
      const tileCount = getTileCount();
      const head = snake[0];
      if (head.x < 0 || head.x >= tileCount || head.y < 0 || head.y >= tileCount) return true;
      return snake.slice(1).some(segment => segment.x === head.x && segment.y === head.y);
    }

    function handleGameOver() {
      clearInterval(gameInterval);
      finalScoreEl.innerText = score;
      if (score > highScore) {
        highScore = score;
        localStorage.setItem("snakeHighScore", highScore);
      }
      updateHud();
      gameOverScreen.classList.remove("hidden");
    }

    function togglePause() {
      if (gameInterval) {
        clearInterval(gameInterval);
        gameInterval = null;
        gameOverScreen.classList.remove("hidden");
        gameOverScreen.querySelector("h2").innerText = "PAUSED";
        gameOverScreen.querySelector("p").innerText = "Press SPACE to resume";
        return;
      }
      gameOverScreen.querySelector("h2").innerText = "PAUSED";
      gameOverScreen.querySelector("p").innerText = "Press SPACE to resume";
      gameOverScreen.classList.add("hidden");
      startGame();
    }

    function resetGame() {
      snake = [{ x: Math.floor(getTileCount() / 2), y: Math.floor(getTileCount() / 2) }];
      dx = 1;
      dy = 0;
      score = 0;
      level = 1;
      updateHud();
      generateFood();
      finalScoreEl.innerText = score;
      gameOverScreen.classList.add("hidden");
      gameOverScreen.querySelector("h2").innerText = "GAME OVER";
      gameOverScreen.querySelector("p").innerText = `Final Score: ${score}`;
      startGame();
    }

    function toggleFullScreen() {
      if (!document.fullscreenElement) {
        document.documentElement.requestFullscreen().catch(() => {});
      } else {
        document.exitFullscreen().catch(() => {});
      }
    }

    function onWindowResize() {
      resizeCanvas();
    }

    function onFullScreenChange() {
      fullscreenBtn.innerText = document.fullscreenElement ? "EXIT FULL SCREEN" : "ENTER FULL SCREEN";
      resizeCanvas();
    }

    startGame();
  </script>
</body>
</html>
